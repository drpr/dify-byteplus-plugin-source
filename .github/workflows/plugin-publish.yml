name: Auto Create PR on Main Push

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  TARGET_REPO: drpr/dify-byteplus-plugins
  UPSTREAM_REPO: langgenius/dify-plugins

jobs:
  detect_plugins:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed plugin directories
        id: detect
        shell: bash
        run: |
          plugins=(model-plugin seedream-tool seedance-tool)

          if [[ "${{ github.event_name }}" == "workflow_dispatch" || -z "${{ github.event.before }}" || "${{ github.event.before }}" =~ ^0+$ ]]; then
            selected=("${plugins[@]}")
          else
            mapfile -t changed_files < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            selected=()
            for plugin in "${plugins[@]}"; do
              for changed_file in "${changed_files[@]}"; do
                if [[ "$changed_file" == "$plugin/"* ]]; then
                  selected+=("$plugin")
                  break
                fi
              done
            done
          fi

          SELECTED_PLUGINS=$(printf '%s\n' "${selected[@]}")
          SELECTED_PLUGINS="$SELECTED_PLUGINS" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          plugins = [line.strip() for line in os.environ.get("SELECTED_PLUGINS", "").splitlines() if line.strip()]
          matrix = {"include": [{"plugin_dir": plugin} for plugin in plugins]}

          print(f"matrix={json.dumps(matrix, separators=(',', ':'))}")
          print(f"has_changes={'true' if plugins else 'false'}")
          PY

  create_pr:
    needs: detect_plugins
    if: needs.detect_plugins.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect_plugins.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download CLI tool
        run: |
          mkdir -p $RUNNER_TEMP/bin
          cd $RUNNER_TEMP/bin
          wget https://github.com/langgenius/dify-plugin-daemon/releases/download/0.0.6/dify-plugin-linux-amd64
          chmod +x dify-plugin-linux-amd64

      - name: Validate publish token and repo access
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_ACTION }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Missing repository secret PLUGIN_ACTION."
            exit 1
          fi
          gh auth status >/dev/null 2>&1 || {
            echo "::error::PLUGIN_ACTION is invalid or expired."
            exit 1
          }
          gh api "repos/${{ env.TARGET_REPO }}" >/dev/null || {
            echo "::error::PLUGIN_ACTION cannot access ${{ env.TARGET_REPO }}. Ensure it has repository access and contents write permission."
            exit 1
          }
          gh api "repos/${{ env.UPSTREAM_REPO }}" >/dev/null || {
            echo "::error::PLUGIN_ACTION cannot access ${{ env.UPSTREAM_REPO }}. Ensure it can create or edit pull requests against the upstream repository."
            exit 1
          }

      - name: Get basic info from manifest
        id: get_basic_info
        run: |
          PLUGIN_NAME=$(grep "^name:" "$GITHUB_WORKSPACE/${{ matrix.plugin_dir }}/manifest.yaml" | cut -d' ' -f2)
          echo "plugin_name=$PLUGIN_NAME" >> $GITHUB_OUTPUT
          VERSION=$(grep "^version:" "$GITHUB_WORKSPACE/${{ matrix.plugin_dir }}/manifest.yaml" | cut -d' ' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          AUTHOR=$(grep "^author:" "$GITHUB_WORKSPACE/${{ matrix.plugin_dir }}/manifest.yaml" | cut -d' ' -f2)
          echo "author=$AUTHOR" >> $GITHUB_OUTPUT

      - name: Package Plugin
        id: package
        run: |
          cd "$GITHUB_WORKSPACE/${{ matrix.plugin_dir }}"
          PACKAGE_NAME="${{ steps.get_basic_info.outputs.plugin_name }}-${{ steps.get_basic_info.outputs.version }}.difypkg"
          $RUNNER_TEMP/bin/dify-plugin-linux-amd64 plugin package . -o "$PACKAGE_NAME"
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT

      - name: Clone target repo
        run: git clone --depth 1 "https://github.com/${{ env.TARGET_REPO }}.git" dify-plugins

      - name: Prepare and push branch
        id: publish
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_ACTION }}
        run: |
          PACKAGE_NAME="${{ steps.get_basic_info.outputs.plugin_name }}-${{ steps.get_basic_info.outputs.version }}.difypkg"
          PACKAGE_RELATIVE_PATH="${{ steps.get_basic_info.outputs.author }}/${{ steps.get_basic_info.outputs.plugin_name }}/$PACKAGE_NAME"
          mkdir -p "dify-plugins/${{ steps.get_basic_info.outputs.author }}/${{ steps.get_basic_info.outputs.plugin_name }}"
          cp "$GITHUB_WORKSPACE/${{ matrix.plugin_dir }}/$PACKAGE_NAME" "dify-plugins/$PACKAGE_RELATIVE_PATH"
          cd dify-plugins
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          BRANCH_NAME="bump-${{ steps.get_basic_info.outputs.plugin_name }}-plugin-${{ steps.get_basic_info.outputs.version }}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          git checkout -B "$BRANCH_NAME" origin/main
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ env.TARGET_REPO }}.git"
          git add "$PACKAGE_RELATIVE_PATH"
          if git diff --cached --quiet; then
            echo "skip_pr=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "bump ${{ steps.get_basic_info.outputs.plugin_name }} plugin to version ${{ steps.get_basic_info.outputs.version }}"
          git push -u origin "$BRANCH_NAME" --force
          echo "skip_pr=false" >> $GITHUB_OUTPUT

      - name: Create PR via GitHub API
        if: steps.publish.outputs.skip_pr != 'true'
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_ACTION }}
        run: |
          BRANCH_NAME="${{ steps.publish.outputs.branch_name }}"
          PR_TITLE="bump ${{ steps.get_basic_info.outputs.plugin_name }} plugin to version ${{ steps.get_basic_info.outputs.version }}"
          PR_BODY="bump ${{ steps.get_basic_info.outputs.plugin_name }} plugin package to version ${{ steps.get_basic_info.outputs.version }}\n\nChanges:\n- Updated plugin package file"
          EXISTING_PR_NUMBER=$(gh pr list \
            --repo "${{ env.UPSTREAM_REPO }}" \
            --head "${{ steps.get_basic_info.outputs.author }}:$BRANCH_NAME" \
            --base main \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR_NUMBER" ] && [ "$EXISTING_PR_NUMBER" != "null" ]; then
            gh pr edit "$EXISTING_PR_NUMBER" \
              --repo "${{ env.UPSTREAM_REPO }}" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          else
            gh pr create \
              --repo "${{ env.UPSTREAM_REPO }}" \
              --head "${{ steps.get_basic_info.outputs.author }}:$BRANCH_NAME" \
              --base main \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          fi
